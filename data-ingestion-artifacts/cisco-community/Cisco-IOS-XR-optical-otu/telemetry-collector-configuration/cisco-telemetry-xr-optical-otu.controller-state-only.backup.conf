[[inputs.cisco_telemetry_mdt]]
  ## Telemetry transport can be "tcp" or "grpc". TLS is supported only with
  ## grpc transport.
  transport = "tcp"

  ## Address and port to host the telemetry listener.
  ## Configure IOS XR MDT dial-out subscriptions to send to this listener.
  service_address = ":5556"

  ## Increase from Telegraf default because optical/OTU payloads can be large.
  max_msg_size = 200000000

  ## TLS options for grpc transport only.
  # tls_cert = "/etc/telegraf/cert.pem"
  # tls_key = "/etc/telegraf/key.pem"
  # tls_allowed_cacerts = ["/etc/telegraf/clientca.pem"]

  ## Map telemetry encoding paths to Telegraf measurement names.
  [inputs.cisco_telemetry_mdt.aliases]
    cisco_ios_xr_optics_info = "Cisco-IOS-XR-controller-optics-oper:optics-oper/optics-ports/optics-port/optics-info"
    cisco_ios_xr_otu_info = "Cisco-IOS-XR-controller-otu-oper:otu/controllers/controller/info"

####################################################################################################
# Processors
####################################################################################################

## Optional source-to-host mapping. Replace example source values with device
## addresses from the deployment, or remove this processor to keep the raw
## telemetry source tag.
# [[processors.enum]]
#   order = 1
#   namepass = ["cisco_ios_xr_optics_info*", "cisco_ios_xr_otu_info*"]

#   [[processors.enum.mapping]]
#     tag = "source"
#     dest = "host_name"

#     [processors.enum.mapping.value_mappings]
#       "192.0.2.10" = "xr-optical-node-1"
#       "192.0.2.11" = "xr-optical-node-2"

[[processors.enum]]
  order = 3
  namepass = ["cisco_ios_xr_optics_info*", "cisco_ios_xr_otu_info*"]

  [[processors.enum.mapping]]
    field = "laser_state"

    [processors.enum.mapping.value_mappings]
      "on" = "1"
      "off" = "0"

[[processors.enum]]
  order = 4
  namepass = ["cisco_ios_xr_optics_info*", "cisco_ios_xr_otu_info*"]

  [[processors.enum.mapping]]
    field = "alarm_detected"

    [processors.enum.mapping.value_mappings]
      "true" = "1"
      "false" = "0"

[[processors.enum]]
  order = 5
  namepass = ["cisco_ios_xr_optics_info*", "cisco_ios_xr_otu_info*"]

  [[processors.enum.mapping]]
    field = "state"

    [processors.enum.mapping.value_mappings]
      "down" = "0"
      "admin-down" = "-1"
      "up" = "1"

[[processors.enum]]
  order = 6
  namepass = ["cisco_ios_xr_optics_info*", "cisco_ios_xr_otu_info*"]

  [[processors.enum.mapping]]
    field = "controller_state"

    [processors.enum.mapping.value_mappings]
      "optics-state-down" = "0"
      "optics-state-admin-down" = "-1"
      "optics-state-up" = "1"

[[processors.strings]]
  order = 7
  namepass = ["cisco_ios_xr_optics_info*", "cisco_ios_xr_otu_info*"]

  [[processors.strings.trim_suffix]]
    field = "qmargin"
    suffix = "dB"

  [[processors.strings.trim_suffix]]
    field = "qfactor"
    suffix = "dB"

  [[processors.strings.trim_suffix]]
    field = "apparent_rx_span_loss"
    suffix = " dB"

  [[processors.strings.trim_suffix]]
    field = "apparent_tx_span_loss"
    suffix = " dB"

  [[processors.strings.trim_suffix]]
    field = "dfb_rx_span_loss_with_pumps_off"
    suffix = " dB"

  [[processors.strings.trim_suffix]]
    field = "dfb_tx_span_loss_with_pumps_off"
    suffix = " dB"

  [[processors.strings.trim_suffix]]
    field = "est_rx_span_loss"
    suffix = " dB"

  [[processors.strings.trim_suffix]]
    field = "est_tx_span_loss"
    suffix = " dB"

[[processors.strings]]
  order = 8
  namepass = ["cisco_ios_xr_otu_info*"]

  [[processors.strings.trim_suffix]]
    field = "bandwidth"
    suffix = "Gb/s"

[[processors.converter]]
  order = 9
  namepass = ["cisco_ios_xr_otu_info*"]

  [processors.converter.fields]
    float = ["bandwidth"]

[[processors.converter]]
  order = 10
  namepass = ["cisco_ios_xr_optics_info*", "cisco_ios_xr_otu_info*"]

  [processors.converter.fields]
    float = [
      "qfactor",
      "qmargin",
      "otu_fec_satistics/pre_fec_ber",
      "otu_fec_satistics/post_fec_ber",
      "second_order_polarization_mode_dispersion",
      "polarization_mode_dispersion",
      "lane_data/transmit_power",
      "lane_data/receive_power",
      "dwdm_carrier_frequency",
      "dwdm_carrier_wavelength",
      "optical_signal_to_noise_ratio",
      "apparent_rx_span_loss",
      "apparent_tx_span_loss",
      "dfb_rx_span_loss_with_pumps_off",
      "dfb_tx_span_loss_with_pumps_off",
      "est_rx_span_loss",
      "est_tx_span_loss",
      "ec",
      "uc",
      "baud_rate",
      "pre_fec_val",
    ]
    integer = ["laser_state", "state", "alarm_detected", "controller_state"]

## Within the Telegraf-based telemetry collector, sessionName and sessionId are
## used as the PCA monitored object name and ID.
[[processors.template]]
  order = 19
  namepass = ["cisco_ios_xr_optics_info*"]
  tag = "sessionId"
  template = '{{ .Tag "source" }}_{{ .Tag "name" }}'

[[processors.template]]
  order = 20
  namepass = ["cisco_ios_xr_optics_info*"]
  tag = "sessionName"
  template = '{{ .Tag "source" }}_{{ .Tag "name" }}'

[[processors.template]]
  order = 21
  namepass = ["cisco_ios_xr_optics_info*"]
  tag = "objectType"
  template = "cisco_ios_xr_optics_info"

[[processors.template]]
  order = 22
  namepass = ["cisco_ios_xr_optics_info*"]
  tag = "direction"
  template = "-1"

[[processors.template]]
  order = 23
  namepass = ["cisco_ios_xr_otu_info*"]
  tag = "sessionId"
  template = '{{ .Tag "source" }}_{{ .Tag "controller_name" }}'

[[processors.template]]
  order = 24
  namepass = ["cisco_ios_xr_otu_info*"]
  tag = "sessionName"
  template = '{{ .Tag "source" }}_{{ .Tag "controller_name" }}'

[[processors.template]]
  order = 21
  namepass = ["cisco_ios_xr_otu_info*"]
  tag = "objectType"
  template = "cisco_ios_xr_otu_info"

[[processors.template]]
  order = 25
  namepass = ["cisco_ios_xr_otu_info*"]
  tag = "direction"
  template = "-1"

[[processors.tag_limit]]
  namepass = ["cisco_ios_xr_optics_info*", "cisco_ios_xr_otu_info*"]
  fieldinclude = [
    "alarm_detected",
    "baud_rate",
    "cd",
    "controller_state",
    "dwdm_carrier_frequency",
    "dwdm_carrier_wavelength",
    "lane_data/receive_power",
    "lane_data/transmit_power",
    "laser_state",
    "optical_signal_to_noise_ratio",
    "temperature",
    "voltage",
    "bandwidth",
    "otu_fec_satistics/post_fec_ber",
    "otu_fec_satistics/pre_fec_ber",
    "pre_fec_val",
    "qfactor",
    "qmargin",
    "state",
  ]

  ## Maximum number of tags to preserve.
  limit = 8

  ## Tags required by PCA ingestion.
  keep = ["sessionId", "sessionName", "objectType", "direction"]
