      "if_name",
      "port_number",
      "port_state",
      "ptp_vlan_id",
      "subordinate_port",
    ]
    integer = [
      "timescale_is_ptp",
      "port_enabled",
      "ptp_vlan_id_valid",
      "tag_native_vlan",
    ]

[[processors.template]]
order = 5
  namepass = ["xe_ptp_*"]
  tag = "direction"
  template = "-1"

[[processors.template]]
order = 6
  namepass = ["xe_ptp_clock"]
  tag = "objectType"
  template = "cisco-telemetry-xe-ptp-clock"

[[processors.template]]
order = 6
  namepass = ["xe_ptp_parent"]
  tag = "objectType"
  template = "cisco-telemetry-xe-ptp-parent"

[[processors.template]]
order = 6
  namepass = ["xe_ptp_port"]
  tag = "objectType"
  template = "cisco-telemetry-xe-ptp-port"

[[processors.template]]
order = 6
  namepass = ["xe_ptp_correction_stats"]
  tag = "objectType"
  template = "cisco-telemetry-xe-ptp-correction-stats"

[[processors.template]]
order = 7
  namepass = ["xe_ptp_correction_stats"]
  tag = "if_name"
  template = '{{ .Tag "subordinate_port" }}'

[[processors.template]]
order = 8
  namepass = ["xe_ptp_clock", "xe_ptp_parent"]
  tag = "object_id"
  template = '{{ .Tag "source" }}_{{ .Tag "clock_domain" }}'

[[processors.template]]
order = 8
  namepass = ["xe_ptp_port", "xe_ptp_correction_stats"]
  tag = "object_id"
  template = '{{ .Tag "source" }}_{{ .Tag "if_name" }}'

[[processors.template]]
order = 9
  namepass = ["xe_ptp_clock"]
  tag = "sessionId"
  template = '{{ .Tag "object_id" }}_ptp-clock'

[[processors.template]]
order = 9
  namepass = ["xe_ptp_parent"]
  tag = "sessionId"
  template = '{{ .Tag "object_id" }}_ptp-parent'

[[processors.template]]
order = 9
  namepass = ["xe_ptp_port"]
  tag = "sessionId"
  template = '{{ .Tag "object_id" }}_ptp-port'

[[processors.template]]
order = 9
  namepass = ["xe_ptp_correction_stats"]
  tag = "sessionId"
  template = '{{ .Tag "object_id" }}_ptp-correction-stats'

[[processors.template]]
order = 10
  namepass = ["xe_ptp_*"]
  tag = "sessionName"
  template = '{{ .Tag "sessionId" }}'

[[processors.regex]]
order = 11
namepass = ["xe_ptp_*"]
  [[processors.regex.tags]]
    key = "object_id"
    pattern = "[/:|[:space:]]+"
    replacement = "_"
  [[processors.regex.tags]]
    key = "sessionId"
    pattern = "[/:|[:space:]]+"
    replacement = "_"
  [[processors.regex.tags]]
    key = "sessionName"
    pattern = "[/:|[:space:]]+"
    replacement = "_"

[[processors.tag_limit]]
order = 12
  namepass = ["xe_ptp_clock"]
  fieldinclude = [
        "offset_from_master_ns",
        "mean_path_delay_ns",
        "steps_removed_count",
        "max_offset_from_master_ns",
        "clock_class",
        "clock_offset_scaled_log_variance",
        "num_ptp_ports_count",
        "current_utc_offset_seconds",
        "timescale_is_ptp",
        "dscp_event",
        "dscp_general"
  ]

  ## Maximum number of tags to preserve
  limit = 16

  ## List of tags to preferentially preserve
  keep = ["sessionId", "sessionName", "objectType", "direction", "source", "clock_domain", "ptp_device_type", "ptp_clock_id", "clock_priority1", "clock_priority2", "ptp_local_clock_priority", "profile", "clock_accuracy", "transport_protocol", "delay_mechanism", "time_source"]

[[processors.tag_limit]]
order = 12
  namepass = ["xe_ptp_parent"]
  fieldinclude = [
        "observed_parent_offset_scaled_log_variance",
        "observed_parent_clock_phase_change_rate",
        "grandmaster_clock_class",
        "grandmaster_priority1",
        "grandmaster_priority2"
  ]

  ## Maximum number of tags to preserve
  limit = 10

  ## List of tags to preferentially preserve
  keep = ["sessionId", "sessionName", "objectType", "direction", "source", "clock_domain", "parent_clock_id", "parent_port_number", "grandmaster_identity", "grandmaster_clock_accuracy"]

[[processors.tag_limit]]
order = 12
  namepass = ["xe_ptp_port"]
  fieldinclude = [
        "peer_mean_path_delay_ns",
        "sync_fault_limit_ns",
        "announce_receipt_timeout_count",
        "port_enabled",
        "ptp_vlan_id_valid",
        "tag_native_vlan",
        "log_mean_announce_interval",
        "log_mean_sync_interval",
        "log_min_mean_pdelay_req_interval",
        "log_min_mean_delay_req_interval"
  ]

  ## Maximum number of tags to preserve
  limit = 10

  ## List of tags to preferentially preserve
  keep = ["sessionId", "sessionName", "objectType", "direction", "source", "if_name", "ptp_clock_id", "port_number", "port_state", "ptp_vlan_id"]

[[processors.tag_limit]]
order = 12
  namepass = ["xe_ptp_correction_stats"]
  fieldinclude = [
        "correction_offset_ns",
        "correction_mean_path_delay_ns"
  ]

  ## Maximum number of tags to preserve
  limit = 7

  ## List of tags to preferentially preserve
  keep = ["sessionId", "sessionName", "objectType", "direction", "source", "if_name", "subordinate_port"]



# XE Memory Stats

