[[processors.starlark]]
order = 2
namepass = ["xe_ptp_oper"]
source = '''
load("time.star", "time")

BOOL_FIELDS = [
  "timescale_is_ptp",
  "port_enabled",
  "ptp_vlan_id_valid",
  "tag_native_vlan",
]

def normalize_bool(metric, name):
  value = metric.fields.get(name)
  if value == True:
    metric.fields[name] = 1
  elif value == False:
    metric.fields[name] = 0
  elif str(value).lower() == "true":
    metric.fields[name] = 1
  elif str(value).lower() == "false":
    metric.fields[name] = 0

def apply(metric):
  for name in BOOL_FIELDS:
    normalize_bool(metric, name)

  sup_time = metric.fields.get("sup_time")
  if sup_time != None:
    parsed = time.parse_time(str(sup_time), format="2006-01-02T15:04:05.999999Z07:00", location="UTC")
    metric.time = parsed.unix_nano

  return metric
'''

