[[inputs.cisco_telemetry_mdt]]
 ## Telemetry transport can be "tcp" or "grpc".  TLS is only supported when
 ## using the grpc transport.
 transport = "grpc"

 ## Address and port to host telemetry listener
 service_address = ":57000"

 ## Grpc Maximum Message Size, default is 4MB, increase the size.
 max_msg_size = 104857600  # 100 MB in bytes

 ## Enable TLS; grpc transport only.
 # tls_cert = "/etc/telegraf/cert.pem"
 # tls_key = "/etc/telegraf/key.pem"

 ## Enable TLS client authentication and define allowed CA certificates; grpc
 ##  transport only.
 # tls_allowed_cacerts = ["/etc/telegraf/clientca.pem"]

 ## Define (for certain nested telemetry measurements with embedded tags) which fields are tags
 embedded_tags = [
  "Cisco-IOS-XR-qos-ma-oper:qos/interface-table/interface/input/service-policy-names/service-policy-instance/statistics/class-stats/class-name",
  "Cisco-IOS-XR-qos-ma-oper:qos/interface-table/interface/input/service-policy-names/service-policy-instance/statistics/class-stats/child-policy/policy-name",
  "Cisco-IOS-XR-qos-ma-oper:qos/interface-table/interface/input/service-policy-names/service-policy-instance/statistics/class-stats/child-policy/class-stats/class-name",
  "Cisco-IOS-XR-qos-ma-oper:qos/interface-table/interface/output/service-policy-names/service-policy-instance/statistics/class-stats/class-name",
  "Cisco-IOS-XR-qos-ma-oper:qos/interface-table/interface/output/service-policy-names/service-policy-instance/statistics/class-stats/child-policy/policy-name",
  "Cisco-IOS-XR-qos-ma-oper:qos/interface-table/interface/output/service-policy-names/service-policy-instance/statistics/class-stats/child-policy/class-stats/class-name",
]
 ## Define aliases to map telemetry encoding paths to simple measurement names
 [inputs.cisco_telemetry_mdt.aliases]
     if_stats = "Cisco-IOS-XR-pfi-im-cmd-oper:interfaces/interface-xr/interface"
     policy_out_stats = "Cisco-IOS-XR-qos-ma-oper:qos/interface-table/interface/output/service-policy-names/service-policy-instance/statistics"
     policy_in_stats = "Cisco-IOS-XR-qos-ma-oper:qos/interface-table/interface/input/service-policy-names/service-policy-instance/statistics"
     sla_stats = "Cisco-IOS-XR-infra-sla-oper:sla/protocols/Cisco-IOS-XR-ethernet-cfm-oper:ethernet/statistics-historicals/statistics-historical"
     cpu_util = "Cisco-IOS-XR-wdsysmon-fd-oper:system-monitoring/cpu-utilization"
     node_summary = "Cisco-IOS-XR-nto-misc-oper:memory-summary/nodes/node/summary"
     ipsla = "Cisco-IOS-XR-man-ipsla-oper:ipsla/operation-data/operations/operation/statistics/latest/target"

     xe_cpu_stats = "Cisco-IOS-XE-process-cpu-oper:cpu-usage/cpu-utilization"
     xe_memory_stats = "Cisco-IOS-XE-memory-oper:memory-statistics/memory-statistic"
     xe_if_stats = "Cisco-IOS-XE-interfaces-oper:interfaces/interface"
     xe_bgp_neighbors = "Cisco-IOS-XE-bgp-oper:bgp-state-data/neighbors/neighbor"
     xe_environment_sensor = "Cisco-IOS-XE-environment-oper:environment-sensors/environment-sensor"

[[processors.starlark]]
order = 1
namepass = ["xe_if_stats*"]
source = '''
def apply(metric):
  metric.fields["statistics/in_octets_rate"] = metric.fields.get("statistics/in_octets")
  metric.fields["statistics/out_octets_rate"] = metric.fields.get("statistics/out_octets")
  metric.fields["statistics/out_octets_64_rate"] = metric.fields.get("statistics/out_octets_64")
  return metric
'''

[[processors.starlark]]
order = 1
namepass = ["xe_bgp_neighbors*"]
source = '''
def tag_from_tag(metric, source, target):
  value = metric.tags.get(source)
  if value != None:
    metric.tags[target] = str(value)

def tag_from_field(metric, source, target):
  value = metric.fields.get(source)
  if value != None:
    metric.tags[target] = str(value)

def apply(metric):
  tag_from_tag(metric, "afi_safi", "bgpAfiSafi")
  tag_from_tag(metric, "vrf_name", "bgpVrfName")
  tag_from_tag(metric, "neighbor_id", "bgpNeighborId")
  tag_from_field(metric, "as", "bgpNeighborAs")
  tag_from_field(metric, "link", "bgpLink")
  tag_from_field(metric, "description", "bgpDescription")
  tag_from_field(metric, "session_state", "bgpSessionState")
  tag_from_field(metric, "connection/state", "bgpConnectionState")
  tag_from_field(metric, "connection/reset_reason", "bgpResetReason")
  tag_from_field(metric, "transport/local_host", "bgpLocalHost")
  tag_from_field(metric, "transport/foreign_host", "bgpForeignHost")
  if metric.tags.get("bgpDescription") == None:
    metric.tags["bgpDescription"] = metric.tags.get("bgpNeighborId")
  return metric
'''

[[processors.starlark]]
order = 1
namepass = ["xe_environment_sensor*"]
source = '''
def sanitize(value):
  value = str(value)
  for char in [": ", ":", " ", "/", "-", "."]:
    value = value.replace(char, "_")
  for _ in range(8):
    value = value.replace("__", "_")
  return value

def apply(metric):
  sensor_name = metric.tags.get("name")
  location = metric.tags.get("location")
  reading = metric.fields.get("current_reading")

  for field in metric.fields.keys():
    metric.fields.pop(field)

  if sensor_name != None and location != None and reading != None:
    metric_name = sanitize(sensor_name) + "_" + sanitize(location)
    metric.fields[metric_name] = reading
  return metric
'''

# XE CPE Stats

[[processors.template]]
order = 1
  namepass = ["xe_cpu_stats"]
  tag = "sessionId"
  template = '{{ .Tag "source" }}'

[[processors.template]]
order = 1
  namepass = ["xe_cpu_stats"]
  tag = "sessionName"
  template = '{{ .Tag "source" }}'


[[processors.template]]
order = 2
  namepass = ["xe_cpu_stats*"]
  tag = "objectType"
  template = 'cisco-telemetry-xe-cpu'

[[processors.template]]
order = 3
  namepass = ["xe_cpu_stats*"]
  tag = "direction"
  template = '-1'

[[processors.tag_limit]]
order = 4
  namepass = ["xe_cpu_stats*"]
  fieldinclude = [
        "five_minutes",
        "five_seconds",
        "five_seconds_intr",
        "one_minute"
  ]

  ## Maximum number of tags to preserve
  limit = 4

  ## List of tags to preferentially preserve
  keep = ["sessionId", "sessionName", "objectType", "direction"]


